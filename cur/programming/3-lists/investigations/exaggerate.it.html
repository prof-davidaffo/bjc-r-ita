<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <script type="text/javascript" src="/bjc-r-ita/llab/loader.js"></script>
    <title>Investigazioni</title>
  </head>

  <body>
    <h2>Esagera</h2>
    <p>
      Scrivi un reporter <code>exaggerate</code> che prende una frase come input
      e riporta una versione esagerata:<br />
      <img
        border="0"
        src="/bjc-r-ita/img/list/hof/exaggerate.png"
        alt="exaggerate (I had 6 really good potstickers for dinner.) -> I had 12 really great potstickers for dinner."
        title="exaggerate (I had 6 really good potstickers for dinner.) -> I had 12 really great potstickers for dinner."
      />
    </p>
    <p>
      Dovrebbe sostituire "good" con "great", "bad" con "terrible", "like" con
      "love", ecc. E dovrebbe sostituire ogni numero con il doppio.
    </p>
  </body>
</html>
