<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Soluzioni BJC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/bjc-r-ita/css/edcdevtech-landingpage.css" />
    <link rel="stylesheet" href="/bjc-r-ita/css/edcdevtech-headerfooter.css" />
    <script src="/bjc-r-ita/llab/loader.js"></script>
    <style>
      main {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 16px 12px 24px 12px;
        box-sizing: border-box;
      }
      .solutions-title { font-size: 28px; margin: 0 0 8px 0; }
      .solutions-subtitle { color: #4a4a4a; margin: 0 0 20px 0; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 18px 0; align-items: center; }
      .chip { border: 1px solid #d8d8d8; background: #f7f7f7; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
      .chip.active { background: #2e6da4; color: #fff; border-color: #2e6da4; }
      .solutions-actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0 8px 0; }
      .solutions-input { padding: 10px 12px; border: 1px solid #d1d1d1; border-radius: 8px; min-width: 220px; font-size: 16px; }
      .solutions-btn { background: #2e6da4; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 16px; cursor: pointer; }
      .solutions-error { color: #b00020; margin-top: 8px; min-height: 20px; }
      .locked-note { display: inline-flex; align-items: center; gap: 8px; background: #f5f5f5; border-radius: 999px; padding: 6px 12px; font-size: 14px; }
      .solutions-list { margin: 0; padding-left: 18px; }
      .solutions-list li { margin: 6px 0; }
      .section-title { margin-top: 20px; }
      details { margin-top: 10px; }
      details summary { cursor: pointer; }
      .solution-text {
        margin-top: 10px;
        background: #fafafa;
        border: 1px solid #ececec;
        border-radius: 8px;
        padding: 14px;
        line-height: 1.55;
        max-width: 100%;
        box-sizing: border-box;
        white-space: normal;
        overflow-wrap: break-word;
        word-break: normal;
      }
      .solution-text p { margin: 8px 0; }
      .solution-text ul { margin: 8px 0; padding-left: 18px; }
      .hint { font-size: 14px; color: #555; margin-top: 8px; }
      .empty-note { color: #555; margin-top: 8px; }
      .split { width: 1px; height: 28px; background: #e2e2e2; }
    </style>
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="wrapper">
        <div class="logo">
          <a class="site-title" rel="author" href="/bjc-r-ita/">
            <img src="/bjc-r-ita/img/header-footer/bjc-logo-sm2.png" alt="BJC logo" class="pull-left" />
            <h1 class="txtTitle">Soluzioni BJC</h1>
          </a>
        </div>
        <div class="trapezoid"></div>
      </div>
    </header>

    <main>
      <h2 class="solutions-title">Soluzioni Unita</h2>
      <p class="solutions-subtitle">Pagina unica con tutte le unita, link XML Snap e note testuali bilingue.</p>

      <div class="toolbar" id="toolbar">
        <span class="locked-note">Area protetta da password</span>
        <div class="split"></div>
        <button class="chip active" type="button" data-lang="it">Italiano</button>
        <button class="chip" type="button" data-lang="en">Originale</button>
      </div>

      <div class="solutions-actions" id="auth-box">
        <input id="solutions-password" class="solutions-input" type="password" placeholder="Password" aria-label="Password" />
        <button id="solutions-unlock" class="solutions-btn">Sblocca</button>
      </div>
      <div id="solutions-error" class="solutions-error"></div>

      <div id="solutions-content" style="display: none;">
        <div class="toolbar" id="unit-tabs"></div>
        <div id="unit-content"></div>
      </div>
    </main>

    <script src="/bjc-r-ita/solutions/solutions-data.js"></script>
    <script src="/bjc-r-ita/solutions/solutions-app.js"></script>
  </body>
</html>
